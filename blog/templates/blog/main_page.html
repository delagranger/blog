{% extends "blog/shell.html" %}

{% block title %}Главная{% endblock %}

{% block body %}
    <h1>Добро пожаловать!</h1>

    <h2>Последние посты:</h2>
    {% for post in posts %}
        <h3>
            <a href="{% url 'post' post.pk %}">{{ post.title }}</a>
        </h3>
    {% empty %}
        <p>Пока нет ни одного поста.</p>
    {% endfor %}
{% endblock %}
