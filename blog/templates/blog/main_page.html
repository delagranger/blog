{% extends "blog/shell.html" %}

{% block title %}Главная{% endblock %}

{% block body %}
    <h1>Добро пожаловать!</h1>
    {% for post in posts %}
        <h2>{{ post.title }}</h2>
        <p>{{ post.body|truncatewords:10 }}</p>
        <p>{{ post.creation_date|date:"d.m.Y" }}</p>
    {% endfor %}
{% endblock %}
